<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파이썬 기초 퀴즈</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }
        .student-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #2563eb;
        }
        .question-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background-color: #dbeafe;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .question-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .choices {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .choice-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s ease;
        }
        .choice-item:hover {
            background-color: #f1f5f9;
        }
        .choice-item input {
            margin-right: 10px;
            width: 16px;
            height: 16px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #1d4ed8;
        }
        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>파이썬 단원 형성평가</h1>

        <!-- 학생 인적사항 -->
        <div class="student-info">
            <div class="input-group">
                <label for="grade">학년</label>
                <input type="text" id="grade" placeholder="예: 2">
            </div>
            <div class="input-group">
                <label for="classNum">반</label>
                <input type="text" id="classNum" placeholder="예: 3">
            </div>
            <div class="input-group">
                <label for="studentNum">번호</label>
                <input type="text" id="studentNum" placeholder="예: 15">
            </div>
            <div class="input-group">
                <label for="studentName">이름</label>
                <input type="text" id="studentName" placeholder="예: 홍길동">
            </div>
        </div>

        <!-- 4지선다 1문제 -->
        <div class="question-box">
            <span class="badge">문제 1</span>
            <div class="question-title">
                1. 파이썬에서 문자열이나 계산 결과를 화면에 출력할 때 사용하는 기본 함수는?
            </div>
            <div class="choices">
                <label class="choice-item">
                    <input type="radio" name="q1" value="1">
                    ① input()
                </label>
                <label class="choice-item">
                    <input type="radio" name="q1" value="2">
                    ② print()
                </label>
                <label class="choice-item">
                    <input type="radio" name="q1" value="3">
                    ③ show()
                </label>
                <label class="choice-item">
                    <input type="radio" name="q1" value="4">
                    ④ write()
                </label>
            </div>
        </div>

        <button type="button" id="submitBtn" onclick="handleSubmit()" class="submit-btn">제출하기</button>
    </div>

    <!-- Firebase SDK & 전송 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZkdSejSd07qftoIAkPDDLcKeT4aZRIf4",
            authDomain: "test1-firebase-55993.firebaseapp.com",
            projectId: "test1-firebase-55993",
            storageBucket: "test1-firebase-55993.firebasestorage.app",
            messagingSenderId: "153243578866",
            appId: "1:153243578866:web:ffb121bb1a74431fb93b6b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isSubmitted = false;

        window.handleSubmit = async function() {
            if (isSubmitted) {
                alert("이미 제출이 완료되었습니다.");
                return;
            }

            const grade = document.getElementById("grade").value.trim();
            const classNum = document.getElementById("classNum").value.trim();
            const studentNum = document.getElementById("studentNum").value.trim();
            const studentName = document.getElementById("studentName").value.trim();

            const selectedChoice = document.querySelector('input[name="q1"]:checked');
            const q1Val = selectedChoice ? selectedChoice.value : "미선택";

            const submitBtn = document.getElementById("submitBtn");

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "제출 중...";

                // Firestore 'quiz_submissions' 컬렉션에 데이터 추가
                await addDoc(collection(db, "quiz_submissions"), {
                    studentInfo: {
                        grade: grade,
                        classNum: classNum,
                        studentNum: studentNum,
                        studentName: studentName
                    },
                    answer: q1Val,
                    submittedAt: serverTimestamp()
                });

                isSubmitted = true;
                submitBtn.innerText = "제출 완료";
                alert("답안이 성공적으로 제출되었습니다!");

                // 답안 수정 방지
                document.querySelectorAll("input").forEach(input => input.disabled = true);

            } catch (error) {
                console.error("전송 에러:", error);
                alert("전송 중 오류가 발생했습니다. 브라우저 콘솔(F12)을 확인해주세요.");
                submitBtn.disabled = false;
                submitBtn.innerText = "제출하기";
            }
        };
    </script>
</body>
</html>
